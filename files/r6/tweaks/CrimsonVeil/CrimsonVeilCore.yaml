# Velo Carmesi / Crimson Veil — TweakXL Core Definitions (Phase 0, 100% Base Game 2.x, 0 ep1)

Mappins.CrimsonVeilQuestMappin:
  $base: Mappins.QuestStaticMappinDefinition
  showInWorld: true
  showOnMap: true
  showOnMinimap: true
  visibilityRange: 100000.0
  possibleVariants:
    - Mappins.DefaultQuestVariant

# ---------------------------------------------------------------------------
# Objetos de Mision Fase 0 (Cartas y Vial de Plasma)
# ---------------------------------------------------------------------------

Items.CrimsonVeil_StainedMoonCard:
  $base: Items.q001_netrunner_software_shard
  displayName: LocKey#cv_item_moon_card_name
  localizedDescription: LocKey#cv_item_moon_card_desc
  quality: Quality.Rare
  tags:
    - !append-once Quest

Items.CrimsonVeil_PlasmaSample:
  $base: Items.q001_netrunner_software_shard
  displayName: LocKey#cv_item_plasma_name
  localizedDescription: LocKey#cv_item_plasma_desc
  quality: Quality.Legendary
  tags:
    - !append-once Quest

# ---------------------------------------------------------------------------
# Recompensa Iconica Fase 0 — Hoja de Neurotoxina «Colmillo Palido»
# ---------------------------------------------------------------------------

Items.CrimsonVeilKnifeAbility:
  $base: Items.IconicWeaponModAbilityBase
  UIData:
    $type: gamedataGameplayLogicPackageUIData_Record
    localizedDescription: LocKey#cv_weapon_fang_ability

Items.CrimsonVeilKnifeIconicMod:
  $base: Items.IconicMeleeWeaponModBase
  OnAttach:
    - Items.CrimsonVeilKnifeAbility
  statModifiers:
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.ChemicalDamage
      value: 28.0
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.CritChance
      value: 18.0
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.CritDamage
      value: 25.0

Items.Preset_Neurotoxin_Knife_CrimsonVeil:
  $base: Items.Preset_Neurotoxin_Knife_Default
  displayName: LocKey#cv_weapon_fang_name
  localizedDescription: LocKey#cv_weapon_fang_desc
  quality: Quality.Epic
  tags:
    - !append-once IconicWeapon
  statModifiers:
    - !append-once
      $type: gamedataConstantStatModifier_Record
      modifierType: Additive
      statType: BaseStats.IsItemIconic
      value: 1.0
  slotPartListPreset:
    - !append-once
      $type: gamedataSlotItemPartPreset_Record
      slot: AttachmentSlots.IconicMeleeWeaponMod1
      itemPartPreset: Items.CrimsonVeilKnifeIconicMod

