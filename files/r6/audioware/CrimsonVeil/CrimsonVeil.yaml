  cv_r2_alley_qa_missing_m:
    en-us:
      file: ./audio/en/cv_r2_alley_qa_missing_m.ogg
      subtitle: Mateo, a night-shift dock tech from Northside, vanished three days before Lucía. He began avoiding daylight and never came back after saying he'd demand his medical file. Before him, two other neighborhood youths vanished.
    es-es:
      file: ./audio/es/cv_r2_alley_qa_missing_m.ogg
      subtitle: Mateo, un técnico nocturno del muelle de Northside, desapareció tres días antes que Lucía. Empezó a evitar la luz del día y no volvió tras decir que exigiría su historial médico. Antes que él faltaron otros dos jóvenes del barrio.
    es-mx:
      file: ./audio/es/cv_r2_alley_qa_missing_m.ogg
