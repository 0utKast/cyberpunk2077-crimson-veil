    en-us:
      file: ./audio/en/cv_r2_roof_chem_m.ogg
      subtitle: I know, V... but the ones who accept that blood aren't only running from sickness. They're looking to belong to something that won't cast them aside at dawn, and that is how that cult traps them.
    es-es:
      file: ./audio/es/cv_r2_roof_chem_m.ogg
      subtitle: Lo sé, V... pero quienes aceptan esa sangre no solo buscan huir de la enfermedad. Buscan pertenecer a algo que no los descarte al amanecer, y ahí es donde esa secta los atrapa.
