      file: ./audio/en/cv_r2_roof_misty_intro.ogg
      subtitle: 'Thank you for coming up on time, V. I laid the cards beside Lucía''s notes: The Moon, The Hermit, and The Tower. If someone took her after leaving that sign, they aren''t far from Watson.'
