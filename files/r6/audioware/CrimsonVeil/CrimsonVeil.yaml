  cv_r2_roof_cards_m:
    en-us:
      file: ./audio/en/cv_r2_roof_cards_m.ogg
      subtitle: The Moon is the nocturnal secret Lucía was already carrying in her veins. The Hanged Man inverted is the false vow of rebirth through silent sacrifice. And The Tower... is the fall when that promised salvation collapses.
    es-es:
      file: ./audio/es/cv_r2_roof_cards_m.ogg
      subtitle: La Luna es el secreto nocturno que Lucía ya guardaba en su piel. El Colgado invertido es la promesa de renacer pagando un sacrificio en silencio. Y La Torre... es la caída cuando esa falsa salvación se derrumba.
