    en-us:
      file: ./audio/en/cv_a1_r2_valdes_ans_sect.ogg
      subtitle: Helena Solís now calls herself The Cantor and twisted my failure into The Pale Chorus. They lure desperate kids like Lucía and Mateo into free night clinics, hook them on weekly dialysis, and turn fear of sunrise into a cage and liturgy. I... kept making stabilizers for months out of guilt and fear. When I saw them abducting anyone who tried to quit, I ran here. That's why they pinned the inverted High Priestess in Kabuki—to warn me they're watching.
    es-es:
      file: ./audio/es/cv_a1_r2_valdes_ans_sect.ogg
      subtitle: 'Helena Solís se hace llamar ahora La Cantora y convirtió mi fracaso en El Coro Pálido. Atraen a chicos desesperados como Lucía y Mateo con clínicas nocturnas gratuitas, los vuelven dependientes de diálisis semanales y usan el pánico al amanecer como jaula y liturgia. Yo... seguí fabricándoles estabilizadores durante meses por culpa y por miedo a que me mataran. Cuando descubrí que secuestraban a quien intentaba dejarlo, escapé aquí. Por eso dejaron La Sacerdotisa invertida en Kabuki: para recordarme que me vigilan.'
