  cv_a2_lucia_a1:
    en-us:
      file: ./audio/en/cv_a2_lucia_a1.ogg
      subtitle: Mateo figured out they weren't curing us—they were locking us into chemical dependency. He cut the cryo lines out in the flats so I could bolt, and Solís gunned him down right in front of me.
    es-es:
      file: ./audio/es/cv_a2_lucia_a1.ogg
      subtitle: Mateo descubrió que no nos estaban curando, sino convirtiéndonos en cobayas dependientes del suero. Cortó los cables criogénicos en mitad del desierto para que yo pudiera huir, pero Solís lo abatió delante de mí y borró su expediente.
