        file: ./audio/en/cv_r2_debrief_v1_male.ogg
        subtitle: The abductors moved her before dawn, but they left behind a batch of NOX-9 plasma and this custom pistol loaded with cold-light rounds. Whoever synthesizes that compound will lead us straight to Lucía and Mateo.
    es-es:
      fem:
        file: ./audio/es/cv_r2_debrief_v1_fem.ogg
