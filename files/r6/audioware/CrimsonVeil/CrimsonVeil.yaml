  cv_a2_roof_misty_epilogue:
    en-us:
      file: ./audio/en/cv_a2_roof_misty_epilogue.ogg
      subtitle: When we raise Esoterica's shutters tomorrow, The Moon on this table won't be an SOS anymore. Take this Crimson Dawn revolver and your Eddies, V—Mateo didn't die for nothing.
    es-es:
      file: ./audio/es/cv_a2_roof_misty_epilogue.ogg
      subtitle: 'Cuando volvamos a abrir Esoterica mañana, La Luna sobre esa mesa ya no será una llamada de socorro en la oscuridad. Toma este revólver Alba Carmesí y tu paga, V: Mateo no murió en vano.'
