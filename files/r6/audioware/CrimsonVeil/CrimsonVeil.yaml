  cv_a1_r2_valdes_ans_leads:
    en-us:
      file: ./audio/en/cv_a1_r2_valdes_ans_leads.ogg
      subtitle: 'Every newly awakened subject and transfer manifest passes first through their cryogenic checkpoint on Watson''s West Pier, guarded by a night sentry and twin UV towers. From that terminal they route shipments to Helena''s main bunker in the Badlands—where she claims to have purified a second-generation serum without porphyrins: NOX-9B.'
    es-es:
      file: ./audio/es/cv_a1_r2_valdes_ans_leads.ogg
      subtitle: 'Todos los sujetos recién despertados y los registros de traslado pasan antes por su puesto criogénico del Muelle Oeste de Watson, custodiado por un centinela nocturno y dos torres ultravioleta. Desde ese terminal coordinan los envíos hacia el búnker central de Helena en las Badlands, donde dice haber purificado una segunda generación del suero sin porfirinas: el NOX-9B.'
