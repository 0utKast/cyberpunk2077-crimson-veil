      file: ./audio/en/cv_r2_roof_open_m2.ogg
      subtitle: 'Lucía asked me to lay out these cards the last time she came up here: The Moon, The Hanged Man inverted, and The Tower. In her notes she wrote of The Pale Chorus, people hiding from daylight somewhere near Northside.'
