  cv_a1_r2_valdes_give_trust:
    en-us:
      file: ./audio/en/cv_a1_r2_valdes_give_trust.ogg
      subtitle: Thank you for hearing me out before judging me. Take this shard on the desk—it holds the night-shift passphrase 'The shadow drinks before dawn', the West Pier cryo terminal coordinates, and my full NOX-9 and NOX-9B dossier. Use it to slip past the UV towers if you can.
    es-es:
      file: ./audio/es/cv_a1_r2_valdes_give_trust.ogg
