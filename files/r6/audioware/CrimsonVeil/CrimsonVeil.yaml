        file: ./audio/es/cv_a1_r2_debrief_v2_fem.ogg
        subtitle: Y todavía hay algo más peligroso. Según las notas de Valdés y los registros de carga, en ese búnker del desierto Solís está probando una segunda versión del suero llamada NOX-9B, sin porfirinas. Si consigue estabilizarlo, dejarán de arder con la luz ultravioleta y perderemos la única ventaja táctica que tenemos contra ellos.
