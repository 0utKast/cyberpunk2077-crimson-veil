  cv_r2_call_misty_02:
    en-us:
      file: ./audio/en/cv_r2_call_misty_02.ogg
      subtitle: 'Friends and neighbors have been vanishing for days without a trace, and I feel like someone is watching me. This morning I found a strange shrine outside my door: half a dozen damp melted candles and a single Tarot card covered in a dark stain.'
    es-es:
      file: ./audio/es/cv_r2_call_misty_02.ogg
      subtitle: 'Varias amigas y vecinos del barrio llevan días desapareciendo sin dejar rastro, y siento que alguien me vigila. Esta mañana encontré un extraño altar delante de la puerta: media docena de cirios derretidos por la humedad y una sola carta del Tarot cubierta por una mancha oscura.'
