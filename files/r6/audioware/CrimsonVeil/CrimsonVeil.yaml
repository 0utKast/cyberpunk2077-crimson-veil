    en-us:
      fem:
        file: ./audio/en/cv_a1_r2_debrief_v2_fem.ogg
        subtitle: And there's an even bigger problem. Valdés's files and the cargo logs say Solís is testing a second-generation serum called NOX-9B out in that desert bunker—without porphyrins. If she stabilizes it, ultraviolet light won't burn them anymore, and we lose our only real edge against them.
