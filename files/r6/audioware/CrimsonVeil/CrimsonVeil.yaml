      fem:
        file: ./audio/en/cv_a1_r2_debrief_v1_fem.ogg
        subtitle: We finally have the full picture, Misty. Dr. Adrián Valdés created NOX-9 six years ago, and Dr. Helena Solís—'The Cantor'—hijacked his work to build The Pale Chorus. The pier manifest confirms they shipped Lucía Reyes and Mateo out of Watson to a sealed Biotechnica bunker in the Badlands.
